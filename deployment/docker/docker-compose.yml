services:
  mpath:
    image: mpath:latest
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: mpath
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.mpath.description=Multipath Intelligence Platform"
      - "com.mpath.version=1.0.1"
